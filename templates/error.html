{% extends "base.html" %}
{% block title %}{{ error.code }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ error.code }} · {{ error.name }}</h1>
  <p>{{ error.description }}</p>
  <p><a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
</section>
{% endblock %}
